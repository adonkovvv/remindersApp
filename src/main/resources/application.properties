spring.application.name=reminders-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/remindersApp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-it-must-be-at-least-32-bytes-long}
app.jwt.expiration=24h

app.notifications.enabled=true
app.notifications.scan-interval=30s
app.notifications.batch-size=100
app.notifications.workers=4
app.notifications.queue-capacity=500
app.notifications.max-attempts=5
app.notifications.default-snooze=10m
