services:
  db:
    image: postgres:16-alpine
    container_name: reminders-db
    environment:
      POSTGRES_DB: remindersApp
      POSTGRES_USER: reminders
      POSTGRES_PASSWORD: reminders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders -d remindersApp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
